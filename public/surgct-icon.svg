<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="surgct-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="scan-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield/Rounded Box -->
  <rect x="6" y="6" width="88" height="88" rx="22" fill="#0b1329" stroke="url(#surgct-grad)" stroke-width="2.5" />
  
  <!-- Subtle Grid Scanlines -->
  <line x1="16" y1="35" x2="84" y2="35" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 2" />
  <line x1="16" y1="50" x2="84" y2="50" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 2" />
  <line x1="16" y1="65" x2="84" y2="65" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 2" />
  <line x1="50" y1="16" x2="50" y2="84" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 2" />

  <!-- Modern Stylized Tooth / Crown & Roots -->
  <path d="M30 32 C30 23, 40 21, 50 25 C60 21, 70 23, 70 32 C70 42, 66 50, 64 64 C62 76, 56 79, 53 79 C51 79, 51 68, 50 64 C49 68, 49 79, 47 79 C44 79, 38 76, 36 64 C34 50, 30 42, 30 32 Z" 
        fill="url(#surgct-grad)" fill-opacity="0.25" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Surgical Implant / Crosshair Matrix Overlay -->
  <circle cx="50" cy="46" r="14" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="3 3" />
  <line x1="50" y1="26" x2="50" y2="66" stroke="#22d3ee" stroke-width="1.8" filter="url(#glow)" />
  <line x1="30" y1="46" x2="70" y2="46" stroke="#22d3ee" stroke-width="1.8" filter="url(#glow)" />
  
  <!-- Central Target Point -->
  <circle cx="50" cy="46" r="3.5" fill="#38bdf8" filter="url(#glow)" />

  <!-- CT Slice Beam -->
  <rect x="22" y="44" width="56" height="4" fill="url(#scan-beam)" rx="2" />
</svg>
